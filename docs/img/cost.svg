<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Model seconds per question: the analyst alone against the full loop, per configuration">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t2{fill:#52514e;font:400 12.5px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t3{fill:#52514e;font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif}
  .grid{stroke:#e4e3df;stroke-width:1} .axis{stroke:#b9b8b2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .link{stroke:#b9b8b2;stroke-width:2} .ring{stroke:#fcfcfb;stroke-width:2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2,.t3{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#5a5955}
    .s1{fill:#3987e5} .s2{fill:#d95926} .link{stroke:#5a5955} .ring{stroke:#1a1a19}}
</style>
<rect class="bg" x="0" y="0" width="1000" height="600" rx="14"/>
<text class="t1" x="24" y="34">What the loop costs: model seconds per question</text>
<circle class="s1" cx="30" cy="56" r="6"/><text class="t2" x="42" y="60">one model (the draft)</text><circle class="s2" cx="210" cy="56" r="6"/><text class="t2" x="222" y="60">loop (draft, audit, rewrite when needed, model loads)</text>
<line class="grid" x1="330.0" y1="96" x2="330.0" y2="524"/><text class="t2" x="330.0" y="90" text-anchor="middle">0 s</text>
<line class="grid" x1="470.0" y1="96" x2="470.0" y2="524"/><text class="t2" x="470.0" y="90" text-anchor="middle">2 s</text>
<line class="grid" x1="610.0" y1="96" x2="610.0" y2="524"/><text class="t2" x="610.0" y="90" text-anchor="middle">4 s</text>
<line class="grid" x1="750.0" y1="96" x2="750.0" y2="524"/><text class="t2" x="750.0" y="90" text-anchor="middle">6 s</text>
<line class="grid" x1="890.0" y1="96" x2="890.0" y2="524"/><text class="t2" x="890.0" y="90" text-anchor="middle">8 s</text>
<text class="t2" x="24" y="125.0">Gemma E4B + Gemma E4B</text><text class="t3" x="314" y="125.0" text-anchor="end">v1</text><line class="link" x1="390.1" y1="121.0" x2="457.9" y2="121.0"/><circle class="s1 ring" cx="390.1" cy="121.0" r="6"><title>one model: 0.86 s</title></circle><circle class="s2 ring" cx="457.9" cy="121.0" r="6"><title>loop: 1.83 s, 22 rewrites of 104</title></circle><text class="t3" x="469.9" y="125.0">2.1x</text>
<text class="t2" x="24" y="155.0">Gemma E4B + Qwen3 4B</text><text class="t3" x="314" y="155.0" text-anchor="end">v1</text><line class="link" x1="398.5" y1="151.0" x2="630.5" y2="151.0"/><circle class="s1 ring" cx="398.5" cy="151.0" r="6"><title>one model: 0.98 s</title></circle><circle class="s2 ring" cx="630.5" cy="151.0" r="6"><title>loop: 4.29 s, 52 rewrites of 104</title></circle><text class="t3" x="642.5" y="155.0">4.4x</text>
<text class="t2" x="24" y="185.0">Qwen3 4B + Gemma E4B</text><text class="t3" x="314" y="185.0" text-anchor="end">v1</text><line class="link" x1="464.5" y1="181.0" x2="618.3" y2="181.0"/><circle class="s1 ring" cx="464.5" cy="181.0" r="6"><title>one model: 1.92 s</title></circle><circle class="s2 ring" cx="618.3" cy="181.0" r="6"><title>loop: 4.12 s, 44 rewrites of 104</title></circle><text class="t3" x="630.3" y="185.0">2.1x</text>
<text class="t2" x="24" y="215.0">Qwen3 4B + Qwen3 4B</text><text class="t3" x="314" y="215.0" text-anchor="end">v1</text><line class="link" x1="463.1" y1="211.0" x2="744.0" y2="211.0"/><circle class="s1 ring" cx="463.1" cy="211.0" r="6"><title>one model: 1.90 s</title></circle><circle class="s2 ring" cx="744.0" cy="211.0" r="6"><title>loop: 5.91 s, 56 rewrites of 104</title></circle><text class="t3" x="756.0" y="215.0">3.1x</text>
<text class="t2" x="24" y="245.0">Gemma E4B + Qwen3 1.7B</text><text class="t3" x="314" y="245.0" text-anchor="end">v1</text><line class="link" x1="397.5" y1="241.0" x2="566.5" y2="241.0"/><circle class="s1 ring" cx="397.5" cy="241.0" r="6"><title>one model: 0.96 s</title></circle><circle class="s2 ring" cx="566.5" cy="241.0" r="6"><title>loop: 3.38 s, 77 rewrites of 104</title></circle><text class="t3" x="578.5" y="245.0">3.5x</text>
<text class="t2" x="24" y="275.0">Qwen3 1.7B + Gemma E4B</text><text class="t3" x="314" y="275.0" text-anchor="end">v1</text><line class="link" x1="391.8" y1="271.0" x2="515.8" y2="271.0"/><circle class="s1 ring" cx="391.8" cy="271.0" r="6"><title>one model: 0.88 s</title></circle><circle class="s2 ring" cx="515.8" cy="271.0" r="6"><title>loop: 2.65 s, 59 rewrites of 104</title></circle><text class="t3" x="527.8" y="275.0">3.0x</text>
<text class="t2" x="24" y="305.0">Gemma E4B + Gemma E4B</text><text class="t3" x="314" y="305.0" text-anchor="end">v2</text><line class="link" x1="409.1" y1="301.0" x2="460.9" y2="301.0"/><circle class="s1 ring" cx="409.1" cy="301.0" r="6"><title>one model: 1.13 s</title></circle><circle class="s2 ring" cx="460.9" cy="301.0" r="6"><title>loop: 1.87 s, 2 rewrites of 104</title></circle><text class="t3" x="472.9" y="305.0">1.7x</text>
<text class="t2" x="24" y="335.0">Gemma E4B + Qwen3 4B</text><text class="t3" x="314" y="335.0" text-anchor="end">v2</text><line class="link" x1="409.1" y1="331.0" x2="699.9" y2="331.0"/><circle class="s1 ring" cx="409.1" cy="331.0" r="6"><title>one model: 1.13 s</title></circle><circle class="s2 ring" cx="699.9" cy="331.0" r="6"><title>loop: 5.28 s, 64 rewrites of 104</title></circle><text class="t3" x="711.9" y="335.0">4.7x</text>
<text class="t2" x="24" y="365.0">Qwen3 4B + Gemma E4B</text><text class="t3" x="314" y="365.0" text-anchor="end">v2</text><line class="link" x1="491.4" y1="361.0" x2="570.7" y2="361.0"/><circle class="s1 ring" cx="491.4" cy="361.0" r="6"><title>one model: 2.31 s</title></circle><circle class="s2 ring" cx="570.7" cy="361.0" r="6"><title>loop: 3.44 s, 7 rewrites of 104</title></circle><text class="t3" x="582.7" y="365.0">1.5x</text>
<text class="t2" x="24" y="395.0">Qwen3 4B + Qwen3 4B</text><text class="t3" x="314" y="395.0" text-anchor="end">v2</text><line class="link" x1="490.8" y1="391.0" x2="797.4" y2="391.0"/><circle class="s1 ring" cx="490.8" cy="391.0" r="6"><title>one model: 2.30 s</title></circle><circle class="s2 ring" cx="797.4" cy="391.0" r="6"><title>loop: 6.68 s, 52 rewrites of 104</title></circle><text class="t3" x="809.4" y="395.0">2.9x</text>
<text class="t2" x="24" y="425.0">Gemma E4B + Qwen3 1.7B</text><text class="t3" x="314" y="425.0" text-anchor="end">v2</text><line class="link" x1="409.1" y1="421.0" x2="558.7" y2="421.0"/><circle class="s1 ring" cx="409.1" cy="421.0" r="6"><title>one model: 1.13 s</title></circle><circle class="s2 ring" cx="558.7" cy="421.0" r="6"><title>loop: 3.27 s, 78 rewrites of 104</title></circle><text class="t3" x="570.7" y="425.0">2.9x</text>
<text class="t2" x="24" y="455.0">Qwen3 1.7B + Gemma E4B</text><text class="t3" x="314" y="455.0" text-anchor="end">v2</text><line class="link" x1="416.9" y1="451.0" x2="502.6" y2="451.0"/><circle class="s1 ring" cx="416.9" cy="451.0" r="6"><title>one model: 1.24 s</title></circle><circle class="s2 ring" cx="502.6" cy="451.0" r="6"><title>loop: 2.47 s, 17 rewrites of 104</title></circle><text class="t3" x="514.6" y="455.0">2.0x</text>
<text class="t2" x="24" y="485.0">Gemma E4B + calc + Gemma E4B</text><text class="t3" x="314" y="485.0" text-anchor="end">v2 + tools</text><line class="link" x1="430.7" y1="481.0" x2="482.6" y2="481.0"/><circle class="s1 ring" cx="430.7" cy="481.0" r="6"><title>one model: 1.44 s</title></circle><circle class="s2 ring" cx="482.6" cy="481.0" r="6"><title>loop: 2.18 s, 2 rewrites of 104</title></circle><text class="t3" x="494.6" y="485.0">1.5x</text>
<text class="t2" x="24" y="515.0">Qwen3 4B + calc + Qwen3 4B</text><text class="t3" x="314" y="515.0" text-anchor="end">v2 + tools</text><line class="link" x1="534.6" y1="511.0" x2="853.5" y2="511.0"/><circle class="s1 ring" cx="534.6" cy="511.0" r="6"><title>one model: 2.92 s</title></circle><circle class="s2 ring" cx="853.5" cy="511.0" r="6"><title>loop: 7.48 s, 48 rewrites of 104</title></circle><text class="t3" x="865.5" y="515.0">2.6x</text>
<text class="t2" x="24" y="570">104 questions per configuration, one model loaded at a time on a laptop RTX 3060. The rewrite runs only when the critic reports issues,</text>
<text class="t2" x="24" y="588">so the cost follows how often the critic objects.</text>
</svg>