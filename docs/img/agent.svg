<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Tool-use benchmark: tasks solved per difficulty level for three models, and totals with 10 or 20 tools">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t2{fill:#52514e;font:400 12.5px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t3{fill:#52514e;font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif}
  .grid{stroke:#e4e3df;stroke-width:1} .axis{stroke:#b9b8b2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .link{stroke:#b9b8b2;stroke-width:2} .ring{stroke:#fcfcfb;stroke-width:2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2,.t3{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#5a5955}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s3{fill:#1baf7a} .link{stroke:#5a5955} .ring{stroke:#1a1a19}}
</style>
<rect class="bg" x="0" y="0" width="1000" height="470" rx="14"/>
<text class="t1" x="24" y="34">Tool-use benchmark: 30 tasks in a small shop world</text>
<rect class="s1" x="24" y="50" width="12" height="12" rx="3"/><text class="t2" x="42" y="60">Gemma E4B</text>
<rect class="s2" x="174" y="50" width="12" height="12" rx="3"/><text class="t2" x="192" y="60">Qwen3 4B</text>
<rect class="s3" x="324" y="50" width="12" height="12" rx="3"/><text class="t2" x="342" y="60">Qwen3 1.7B</text>
<text class="t1" x="24" y="96">Solved per level (10 shop tools)</text>
<line class="grid" x1="60" y1="370" x2="588" y2="370"/><text class="t2" x="52" y="374" text-anchor="end">0%</text>
<line class="grid" x1="60" y1="250" x2="588" y2="250"/><text class="t2" x="52" y="254" text-anchor="end">50%</text>
<line class="grid" x1="60" y1="130" x2="588" y2="130"/><text class="t2" x="52" y="134" text-anchor="end">100%</text>
<rect class="s1" x="70" y="130.0" width="20" height="240.0" rx="4"><title>Gemma E4B, level 1: 5 of 5</title></rect><text class="t3" x="80" y="125.0" text-anchor="middle">5</text>
<rect class="s2" x="93" y="226.0" width="20" height="144.0" rx="4"><title>Qwen3 4B, level 1: 3 of 5</title></rect><text class="t3" x="103" y="221.0" text-anchor="middle">3</text>
<rect class="s3" x="116" y="178.0" width="20" height="192.0" rx="4"><title>Qwen3 1.7B, level 1: 4 of 5</title></rect><text class="t3" x="126" y="173.0" text-anchor="middle">4</text>
<text class="t3" x="103" y="388" text-anchor="middle">L1</text><text class="t2" x="103" y="404" text-anchor="middle">lookup</text>
<rect class="s1" x="158" y="130.0" width="20" height="240.0" rx="4"><title>Gemma E4B, level 2: 6 of 6</title></rect><text class="t3" x="168" y="125.0" text-anchor="middle">6</text>
<rect class="s2" x="181" y="250.0" width="20" height="120.0" rx="4"><title>Qwen3 4B, level 2: 3 of 6</title></rect><text class="t3" x="191" y="245.0" text-anchor="middle">3</text>
<rect class="s3" x="204" y="290.0" width="20" height="80.0" rx="4"><title>Qwen3 1.7B, level 2: 2 of 6</title></rect><text class="t3" x="214" y="285.0" text-anchor="middle">2</text>
<text class="t3" x="191" y="388" text-anchor="middle">L2</text><text class="t2" x="191" y="404" text-anchor="middle">2-step chain</text>
<rect class="s1" x="246" y="274.0" width="20" height="96.0" rx="4"><title>Gemma E4B, level 3: 2 of 5</title></rect><text class="t3" x="256" y="269.0" text-anchor="middle">2</text>
<rect class="s2" x="269" y="322.0" width="20" height="48.0" rx="4"><title>Qwen3 4B, level 3: 1 of 5</title></rect><text class="t3" x="279" y="317.0" text-anchor="middle">1</text>
<rect class="s3" x="292" y="368.0" width="20" height="2.0" rx="4"><title>Qwen3 1.7B, level 3: 0 of 5</title></rect><text class="t3" x="302" y="363.0" text-anchor="middle">0</text>
<text class="t3" x="279" y="388" text-anchor="middle">L3</text><text class="t2" x="279" y="404" text-anchor="middle">policy + maths</text>
<rect class="s1" x="334" y="274.0" width="20" height="96.0" rx="4"><title>Gemma E4B, level 4: 2 of 5</title></rect><text class="t3" x="344" y="269.0" text-anchor="middle">2</text>
<rect class="s2" x="357" y="368.0" width="20" height="2.0" rx="4"><title>Qwen3 4B, level 4: 0 of 5</title></rect><text class="t3" x="367" y="363.0" text-anchor="middle">0</text>
<rect class="s3" x="380" y="368.0" width="20" height="2.0" rx="4"><title>Qwen3 1.7B, level 4: 0 of 5</title></rect><text class="t3" x="390" y="363.0" text-anchor="middle">0</text>
<text class="t3" x="367" y="388" text-anchor="middle">L4</text><text class="t2" x="367" y="404" text-anchor="middle">conditions</text>
<rect class="s1" x="422" y="178.0" width="20" height="192.0" rx="4"><title>Gemma E4B, level 5: 4 of 5</title></rect><text class="t3" x="432" y="173.0" text-anchor="middle">4</text>
<rect class="s2" x="445" y="274.0" width="20" height="96.0" rx="4"><title>Qwen3 4B, level 5: 2 of 5</title></rect><text class="t3" x="455" y="269.0" text-anchor="middle">2</text>
<rect class="s3" x="468" y="226.0" width="20" height="144.0" rx="4"><title>Qwen3 1.7B, level 5: 3 of 5</title></rect><text class="t3" x="478" y="221.0" text-anchor="middle">3</text>
<text class="t3" x="455" y="388" text-anchor="middle">L5</text><text class="t2" x="455" y="404" text-anchor="middle">errors</text>
<rect class="s1" x="510" y="250.0" width="20" height="120.0" rx="4"><title>Gemma E4B, level 6: 2 of 4</title></rect><text class="t3" x="520" y="245.0" text-anchor="middle">2</text>
<rect class="s2" x="533" y="368.0" width="20" height="2.0" rx="4"><title>Qwen3 4B, level 6: 0 of 4</title></rect><text class="t3" x="543" y="363.0" text-anchor="middle">0</text>
<rect class="s3" x="556" y="368.0" width="20" height="2.0" rx="4"><title>Qwen3 1.7B, level 6: 0 of 4</title></rect><text class="t3" x="566" y="363.0" text-anchor="middle">0</text>
<text class="t3" x="543" y="388" text-anchor="middle">L6</text><text class="t2" x="543" y="404" text-anchor="middle">long chain</text>
<text class="t1" x="620" y="96">Total solved: 10 tools → 20 tools</text>
<line class="grid" x1="640" y1="118" x2="640" y2="290"/><text class="t2" x="640" y="112" text-anchor="middle">0</text>
<line class="grid" x1="740" y1="118" x2="740" y2="290"/><text class="t2" x="740" y="112" text-anchor="middle">10</text>
<line class="grid" x1="840" y1="118" x2="840" y2="290"/><text class="t2" x="840" y="112" text-anchor="middle">20</text>
<line class="grid" x1="940" y1="118" x2="940" y2="290"/><text class="t2" x="940" y="112" text-anchor="middle">30</text>
<text class="t2" x="620" y="136">Gemma E4B</text><line class="link" x1="850.0" y1="150" x2="830.0" y2="150"/><circle class="s1 ring" cx="850.0" cy="150" r="6"><title>10 tools: 21</title></circle><rect class="s1 ring" x="824.0" y="144" width="12" height="12" rx="2"><title>20 tools: 19</title></rect><text class="t3" x="864.0" y="154">21 → 19</text>
<text class="t2" x="620" y="188">Qwen3 4B</text><line class="link" x1="730.0" y1="202" x2="750.0" y2="202"/><circle class="s2 ring" cx="730.0" cy="202" r="6"><title>10 tools: 9</title></circle><rect class="s2 ring" x="744.0" y="196" width="12" height="12" rx="2"><title>20 tools: 11</title></rect><text class="t3" x="764.0" y="206">9 → 11</text>
<text class="t2" x="620" y="240">Qwen3 1.7B</text><line class="link" x1="730.0" y1="254" x2="740.0" y2="254"/><circle class="s3 ring" cx="730.0" cy="254" r="6"><title>10 tools: 9</title></circle><rect class="s3 ring" x="734.0" y="248" width="12" height="12" rx="2"><title>20 tools: 10</title></rect><text class="t3" x="754.0" y="258">9 → 10</text>
<text class="t2" x="620" y="328">circle = 10 shop tools, square = plus 10 distractor tools</text>
<text class="t2" x="24" y="446">A task counts only if the answer is right, every required call was made with the right arguments and no forbidden action (such as a refund outside the policy) happened.</text>
</svg>