<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d">
  <title id="t">The analyst, critic and refiner loop</title>
  <desc id="d">A document and question go to the analyst, which writes a draft. A second model, the critic, audits the draft against the document. If the verdict is OK the draft is kept; otherwise the analyst rewrites it using the audit. The result is the final answer.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .card { fill: #ffffff; stroke: #d6d5d0; stroke-width: 1.5; }
    .t1 { fill: #0b0b0b; font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t2 { fill: #52514e; font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .t3 { fill: #52514e; font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .line { stroke: #8a8984; stroke-width: 2; fill: none; }
    .head { fill: #8a8984; }
    .blue { fill: #2a78d6; } .blue-s { stroke: #2a78d6; }
    .orange { fill: #eb6834; } .orange-s { stroke: #eb6834; }
    .aqua { fill: #1baf7a; } .aqua-s { stroke: #1baf7a; }
    .ink { fill: #0b0b0b; } .ink-s { stroke: #0b0b0b; }
    .paper { fill: #ffffff; stroke: #8a8984; stroke-width: 1.5; }
    .rule { stroke: #b9b8b2; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .card { fill: #242423; stroke: #3d3c39; }
      .t1 { fill: #f0efec; } .t2, .t3 { fill: #c3c2b7; }
      .line { stroke: #8f8e88; } .head { fill: #8f8e88; }
      .blue { fill: #3987e5; } .blue-s { stroke: #3987e5; }
      .orange { fill: #d95926; } .orange-s { stroke: #d95926; }
      .aqua { fill: #199e70; } .aqua-s { stroke: #199e70; }
      .ink { fill: #f0efec; } .ink-s { stroke: #f0efec; }
      .paper { fill: #2c2c2a; stroke: #8f8e88; }
      .rule { stroke: #5a5955; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="360" rx="16"/>

  <!-- document + question -->
  <rect class="card" x="20" y="105" width="160" height="130" rx="14"/>
  <rect class="paper" x="78" y="122" width="44" height="54" rx="4"/>
  <line class="rule" x1="86" y1="136" x2="114" y2="136"/><line class="rule" x1="86" y1="146" x2="114" y2="146"/>
  <line class="rule" x1="86" y1="156" x2="108" y2="156"/><line class="rule" x1="86" y1="166" x2="112" y2="166"/>
  <text class="t1" x="100" y="200" text-anchor="middle">Document</text>
  <text class="t2" x="100" y="221" text-anchor="middle">+ question</text>

  <!-- analyst -->
  <rect class="card" x="230" y="95" width="180" height="150" rx="14"/>
  <rect class="blue" x="230" y="95" width="180" height="8" rx="4"/>
  <circle class="blue" cx="320" cy="140" r="17"/>
  <path d="M312 147 l12 -12 l4 4 l-12 12 h-4 z" fill="#ffffff"/>
  <text class="t1" x="320" y="185" text-anchor="middle">Analyst</text>
  <text class="t2" x="320" y="205" text-anchor="middle">Gemma 4 E4B</text>
  <text class="t2" x="320" y="225" text-anchor="middle">writes the draft</text>

  <!-- critic -->
  <rect class="card" x="460" y="95" width="180" height="150" rx="14"/>
  <rect class="orange" x="460" y="95" width="180" height="8" rx="4"/>
  <circle class="orange" cx="550" cy="140" r="17"/>
  <circle cx="547" cy="137" r="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="552" y1="142" x2="559" y2="149" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text class="t1" x="550" y="185" text-anchor="middle">Critic</text>
  <text class="t2" x="550" y="205" text-anchor="middle">a second model</text>
  <text class="t2" x="550" y="225" text-anchor="middle">audits the draft</text>

  <!-- verdict diamond -->
  <path class="card" d="M 715 135 L 750 170 L 715 205 L 680 170 Z"/>
  <text class="t3" x="715" y="175" text-anchor="middle">OK?</text>

  <!-- final answer -->
  <rect class="card" x="820" y="105" width="160" height="130" rx="14"/>
  <rect class="ink" x="820" y="105" width="160" height="8" rx="4"/>
  <circle cx="900" cy="148" r="17" fill="none" class="ink-s" stroke-width="2.5"/>
  <path d="M891 148 l6 6 l12 -12" fill="none" class="ink-s" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t1" x="900" y="192" text-anchor="middle">Final answer</text>
  <text class="t2" x="900" y="213" text-anchor="middle">graded against</text>
  <text class="t2" x="900" y="230" text-anchor="middle">the draft</text>

  <!-- refiner -->
  <rect class="card" x="600" y="268" width="230" height="78" rx="14"/>
  <rect class="aqua" x="600" y="268" width="8" height="78" rx="4"/>
  <text class="t1" x="624" y="298">Refiner</text>
  <text class="t2" x="624" y="320">the analyst rewrites the draft</text>
  <text class="t2" x="624" y="337">using the quoted evidence</text>

  <!-- arrows -->
  <line class="line" x1="180" y1="170" x2="226" y2="170" marker-end="url(#arrow)"/>
  <line class="line" x1="410" y1="170" x2="456" y2="170" marker-end="url(#arrow)"/>
  <text class="t3" x="433" y="160" text-anchor="middle">draft</text>
  <line class="line" x1="640" y1="170" x2="676" y2="170" marker-end="url(#arrow)"/>
  <text class="t3" x="658" y="160" text-anchor="middle">audit</text>
  <line class="line" x1="750" y1="170" x2="816" y2="170" marker-end="url(#arrow)"/>
  <text class="t3" x="783" y="160" text-anchor="middle">yes</text>
  <path class="line" d="M 715 205 L 715 264" marker-end="url(#arrow)"/>
  <text class="t3" x="726" y="242">no</text>
  <path class="line" d="M 830 300 L 900 300 L 900 239" marker-end="url(#arrow)"/>

  <text class="t3" x="20" y="40">Same .litertlm files a phone would run (LiteRT-LM, GPU, greedy decoding)</text>
  <text class="t2" x="20" y="62">The draft is the one-model baseline. The final answer is the loop. Both are graded on the same questions.</text>
</svg>
