<line class="grid" x1="360.0" y1="116" x2="360.0" y2="402"/><text class="t2" x="360.0" y="114" text-anchor="middle">50</text>
<line class="grid" x1="450.0" y1="116" x2="450.0" y2="402"/><text class="t2" x="450.0" y="114" text-anchor="end">100</text>
<rect class="s1" x="270" y="138" width="118.8" height="12" rx="4"><title>Gemma E4B (v2 prompts): precision 66.0</title></rect><text class="t3" x="393.8" y="148">66</text>
<rect class="s2" x="270" y="165" width="62.8" height="12" rx="4"><title>Qwen3 4B (v2 prompts): precision 34.9</title></rect><text class="t3" x="337.8" y="175">35</text>
<rect class="s3" x="270" y="192" width="65.9" height="12" rx="4"><title>Qwen3 1.7B (v2 prompts): precision 36.6</title></rect><text class="t3" x="340.9" y="202">37</text>
<rect class="s3" x="270" y="219" width="65.7" height="12" rx="4"><title>Qwen3 1.7B (v1 prompts): precision 36.5</title></rect><text class="t3" x="340.7" y="229">36</text>
<rect class="ref" x="270" y="256" width="84.4" height="12" rx="4"><title>GPT-4-turbo, prompted: precision 46.9</title></rect><text class="t3" x="359.4" y="266">47</text>
<rect class="ref" x="270" y="283" width="66.8" height="12" rx="4"><title>GPT-3.5-turbo, prompted: precision 37.1</title></rect><text class="t3" x="341.8" y="293">37</text>
<rect class="ref" x="270" y="310" width="89.5" height="12" rx="4"><title>SelfCheckGPT, GPT-3.5-turbo: precision 49.7</title></rect><text class="t3" x="364.5" y="320">50</text>
<rect class="ref" x="270" y="337" width="65.2" height="12" rx="4"><title>LMvLM, GPT-4-turbo: precision 36.2</title></rect><text class="t3" x="340.2" y="347">36</text>
<rect class="ref" x="270" y="364" width="138.4" height="12" rx="4"><title>Llama-2-13B fine-tuned: precision 76.9</title></rect><text class="t3" x="413.4" y="374">77</text>
<rect class="ref" x="270" y="391" width="62.8" height="12" rx="4"><title>Flag every response: precision 34.9</title></rect><text class="t3" x="337.8" y="401">35</text>
<text class="t1" x="508" y="88">Recall</text>
