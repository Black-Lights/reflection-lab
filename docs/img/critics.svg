<rect class="s3" x="508" y="219" width="180.0" height="12" rx="4"><title>Qwen3 1.7B (v1 prompts): recall 100.0</title></rect><text class="t3" x="693.0" y="229">100</text>
<rect class="ref" x="508" y="256" width="176.2" height="12" rx="4"><title>GPT-4-turbo, prompted: recall 97.9</title></rect><text class="t3" x="689.2" y="266">98</text>
<rect class="ref" x="508" y="283" width="166.1" height="12" rx="4"><title>GPT-3.5-turbo, prompted: recall 92.3</title></rect><text class="t3" x="679.1" y="293">92</text>
<rect class="ref" x="508" y="310" width="129.4" height="12" rx="4"><title>SelfCheckGPT, GPT-3.5-turbo: recall 71.9</title></rect><text class="t3" x="642.4" y="320">72</text>
<rect class="ref" x="508" y="337" width="140.0" height="12" rx="4"><title>LMvLM, GPT-4-turbo: recall 77.8</title></rect><text class="t3" x="653.0" y="347">78</text>
<rect class="ref" x="508" y="364" width="145.3" height="12" rx="4"><title>Llama-2-13B fine-tuned: recall 80.7</title></rect><text class="t3" x="658.3" y="374">81</text>
<rect class="ref" x="508" y="391" width="180.0" height="12" rx="4"><title>Flag every response: recall 100.0</title></rect><text class="t3" x="693.0" y="401">100</text>
<text class="t1" x="746" y="88">F1</text>
