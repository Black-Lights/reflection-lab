<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" width="1000" height="496" role="img" aria-label="RAGTruth: precision, recall and F1 of each critic at spotting hallucinated responses, with the paper baselines">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t2{fill:#52514e;font:400 12.5px system-ui,-apple-system,'Segoe UI',sans-serif}
  .t3{fill:#52514e;font:500 12px system-ui,-apple-system,'Segoe UI',sans-serif}
  .grid{stroke:#e4e3df;stroke-width:1} .axis{stroke:#b9b8b2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .ref{fill:#a3a29b} .link{stroke:#b9b8b2;stroke-width:2} .ring{stroke:#fcfcfb;stroke-width:2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2,.t3{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#5a5955}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .ref{fill:#6f6e69} .s3{fill:#1baf7a} .ref{fill:#a3a29b} .link{stroke:#5a5955} .ring{stroke:#1a1a19}}
</style>
<rect class="bg" x="0" y="0" width="1000" height="496" rx="14"/>
<text class="t1" x="24" y="34">Can the critic spot a hallucinated answer? (RAGTruth, 300 responses)</text>
<text class="t2" x="24" y="56">Coloured rows: the critics in this project. Grey rows: the RAGTruth paper. Numbers re-weighted to the full test split.</text>
<text class="t1" x="270" y="88">Precision</text>
