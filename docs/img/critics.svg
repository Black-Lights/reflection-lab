<rect class="s2" x="746" y="165" width="92.9" height="12" rx="4"><title>Qwen3 4B (v2 prompts): f1 51.6</title></rect><text class="t3" x="843.9" y="175">52</text>
<rect class="s3" x="746" y="192" width="95.4" height="12" rx="4"><title>Qwen3 1.7B (v2 prompts): f1 53.0</title></rect><text class="t3" x="846.4" y="202">53</text>
<rect class="s3" x="746" y="219" width="96.3" height="12" rx="4"><title>Qwen3 1.7B (v1 prompts): f1 53.5</title></rect><text class="t3" x="847.3" y="229">54</text>
<rect class="ref" x="746" y="256" width="114.1" height="12" rx="4"><title>GPT-4-turbo, prompted: f1 63.4</title></rect><text class="t3" x="865.1" y="266">63</text>
<rect class="ref" x="746" y="283" width="95.2" height="12" rx="4"><title>GPT-3.5-turbo, prompted: f1 52.9</title></rect><text class="t3" x="846.2" y="293">53</text>
<rect class="ref" x="746" y="310" width="105.8" height="12" rx="4"><title>SelfCheckGPT, GPT-3.5-turbo: f1 58.8</title></rect><text class="t3" x="856.8" y="320">59</text>
<rect class="ref" x="746" y="337" width="88.9" height="12" rx="4"><title>LMvLM, GPT-4-turbo: f1 49.4</title></rect><text class="t3" x="839.9" y="347">49</text>
<rect class="ref" x="746" y="364" width="141.7" height="12" rx="4"><title>Llama-2-13B fine-tuned: f1 78.7</title></rect><text class="t3" x="892.7" y="374">79</text>
<rect class="ref" x="746" y="391" width="93.1" height="12" rx="4"><title>Flag every response: f1 51.7</title></rect><text class="t3" x="844.1" y="401">52</text>
<text class="t2" x="24" y="148">Gemma E4B (v2 prompts)</text>
<text class="t2" x="24" y="175">Qwen3 4B (v2 prompts)</text>
<text class="t2" x="24" y="202">Qwen3 1.7B (v2 prompts)</text>
<text class="t2" x="24" y="229">Qwen3 1.7B (v1 prompts)</text>
<text class="t2" x="24" y="266">GPT-4-turbo, prompted</text>
<text class="t2" x="24" y="293">GPT-3.5-turbo, prompted</text>
<text class="t2" x="24" y="320">SelfCheckGPT, GPT-3.5-turbo</text>
<text class="t2" x="24" y="347">LMvLM, GPT-4-turbo</text>
<text class="t2" x="24" y="374">Llama-2-13B fine-tuned</text>
<text class="t2" x="24" y="401">Flag every response</text>
<text class="t2" x="24" y="432">Positive = hallucinated. A critic that flags everything gets recall 100 and precision 34.9, the share of hallucinated responses; both Qwen3 critics sit there.</text>
<text class="t2" x="24" y="452">Sample: 150 hallucinated and 150 clean responses (QA, summaries, data-to-text). Paper rows: Niu et al. 2024, Table 5, full test set.</text>
</svg>